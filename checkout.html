<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Eye Vision Optics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3"><div class="container"><a class="navbar-brand fs-3 fw-bold" href="index.html"><i class="fas fa-eye"></i> Eye Vision Optics</a><a href="cart.html" class="btn btn-outline-light me-2"><i class="fas fa-arrow-left"></i> Back to Cart</a><button id="darkModeToggle" class="btn btn-outline-light rounded-circle"><i class="fas fa-moon"></i></button></div></nav>

<div class="container my-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-7"><div class="card shadow-lg border-0"><div class="card-header bg-primary text-white text-center py-3"><h4 class="mb-0"><i class="fas fa-check-circle"></i> Checkout</h4></div><div class="card-body p-4"><div id="orderSummary" class="bg-light p-3 rounded mb-4"><h6><i class="fas fa-shopping-cart"></i> Order Summary</h6><div id="checkoutSummary"></div><hr><div id="checkoutTotal" class="fw-bold"></div></div><form id="checkoutForm"><div class="mb-3"><label class="form-label fw-semibold">Full Name</label><input type="text" id="fullName" class="form-control" required></div><div class="mb-3"><label class="form-label fw-semibold">Email</label><input type="email" id="email" class="form-control" required></div><div class="mb-3"><label class="form-label fw-semibold">Phone</label><input type="tel" id="phone" class="form-control" required></div><div class="mb-3"><label class="form-label fw-semibold">Address</label><textarea id="address" class="form-control" rows="2" required></textarea></div><div class="mb-4"><label class="form-label fw-semibold">City</label><select id="city" class="form-select" required><option value="">Select City</option><option>Karachi</option><option>Lahore</option><option>Islamabad</option><option>Rawalpindi</option><option>Multan</option></select></div><button type="submit" class="btn btn-primary w-100 py-3 fw-bold"><i class="fas fa-check-circle"></i> Place Order</button></form><div id="orderConfirmation" style="display:none;"></div></div></div></div></div></div>

<footer class="bg-dark text-white text-center py-3"><p>&copy; 2025 Eye Vision Optics | Secure Checkout</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
